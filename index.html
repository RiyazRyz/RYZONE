
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="RYZONE - One App, Endless Possibilities!">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./assets/ryzon-logo.svg">
<title>RYZONE - Select Your Language</title>

<style>
* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 18px;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg, #142343, #263f70);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  text-align: center;
}

.brand {
  font-size: clamp(42px, 9vw, 68px);
  font-weight: bold;
  letter-spacing: 5px;
  margin-bottom: 16px;
}

.tagline {
  color: #cbd8f5;
  font-size: clamp(17px, 4vw, 28px);
  margin-bottom: 62px;
}

.card {
  width: 100%;
  background: #ffffff;
  color: #172440;
  padding: 55px 45px 45px;
  border-radius: 38px;
  box-shadow: 0 15px 40px #0004;
}

.card h2 {
  font-size: clamp(26px, 5vw, 42px);
  margin: 15px 0 32px;
  line-height: 1.25;
}

.card p {
  font-size: clamp(19px, 4vw, 30px);
  line-height: 1.4;
  margin: 0 0 52px;
}

select, button {
  width: 100%;
  min-height: 92px;
  padding: 18px 28px;
  border-radius: 20px;
  font-size: clamp(18px, 4vw, 27px);
}

select {
  border: 1px solid #cbd0d8;
  background: white;
  color: #111827;
  margin-bottom: 22px;
}

button {
  border: 0;
  background: #2856d7;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: opacity .2s, transform .2s;
}

button:active { transform: scale(.98); }

button:focus-visible, select:focus-visible {
  outline: 3px solid #5c91ff;
  outline-offset: 3px;
}

.random {
  background: #eaf0ff;
  color: #294b91;
  margin-top: 30px;
}

.note {
  font-size: clamp(13px, 3vw, 20px);
  color: #727b8a;
  line-height: 1.5;
  margin-top: 30px;
}

footer {
  color: #cbd8f5;
  font-size: clamp(13px, 3vw, 20px);
  margin-top: 42px;
  line-height: 1.5;
}

@media (max-width: 480px) {
  body { padding: 25px 14px; }

  .tagline { margin-bottom: 38px; }

  .card {
    padding: 32px 22px 30px;
    border-radius: 28px;
  }

  .card h2 { margin: 12px 0 25px; }
  .card p { margin-bottom: 32px; }

  select, button {
    min-height: 66px;
    padding: 14px 18px;
    border-radius: 14px;
  }

  .random { margin-top: 18px; }
  .note { margin-top: 25px; }
  footer { margin-top: 30px; }
}

@media (max-height: 700px) {
  body { align-items: flex-start; }
  .tagline { margin-bottom: 28px; }

  .card {
    padding-top: 28px;
    padding-bottom: 25px;
  }

  .card p { margin-bottom: 25px; }
  select, button { min-height: 58px; }
}
</style>
<script src="./ryzon-branding.js" defer></script>
<link rel="stylesheet" href="./responsive-system.css">
 <link rel="stylesheet" href="./ryzone-metallic-gold.css">
 <link rel="stylesheet" href="./ryzone-reference-design.css">
</head>

<body>

<main class="container">

  <img class="brand-logo" src="./assets/ryzone-wordmark.svg" alt="RYZONE — ONE APP • ENDLESS POSSIBILITIES">

  <div class="tagline">
    One App, Endless Possibilities!
  </div>

  <section class="card">

    <h2>Select Your Language</h2>

    <p>Choose your preferred language</p>

    <select id="language" aria-label="Select Your Language">

      <option value="en">English</option>
      <option value="ta">தமிழ்</option>
      <option value="hi">हिन्दी</option>
      <option value="te">తెలుగు</option>
      <option value="ml">മലയാളം</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="bn">বাংলা</option>
      <option value="mr">मराठी</option>
      <option value="gu">ગુજરાતી</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
      <option value="ur">اردو</option>
      <option value="or">ଓଡ଼ିଆ</option>
      <option value="as">অসমীয়া</option>
      <option value="ne">नेपाली</option>
      <option value="si">සිංහල</option>
      <option value="ar">العربية</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>

    </select>

    <button type="button" onclick="continueApp()">
      Continue →
    </button>

    <button type="button" class="random" onclick="randomChat()">
      💬 Random Chat
    </button>

    <div class="note">
      Random Chat requires mobile OTP verification.
      Verify your mobile number to continue to Random Chat.
    </div>

  </section>

  <footer>
    © RYZONE | One App, Endless Possibilities
  </footer>

</main>

<script>
const LANGUAGE_KEY = "ryzonLanguage";

const oldLanguageValues = {
  "English": "en",
  "தமிழ்": "ta",
  "हिन्दी": "hi",
  "తెలుగు": "te",
  "മലയാളം": "ml",
  "ಕನ್ನಡ": "kn",
  "বাংলা": "bn",
  "मराठी": "mr",
  "ગુજરાતી": "gu",
  "ਪੰਜਾਬੀ": "pa",
  "اردو": "ur",
  "ଓଡ଼ିଆ": "or",
  "অসমীয়া": "as",
  "नेपाली": "ne"
};

function getSelectedLanguage() {
  return document.getElementById("language").value;
}

function saveLanguage() {
  const language = getSelectedLanguage();

  // Save the standard language code.
  localStorage.setItem(LANGUAGE_KEY, language);

  // Set the browser language.
  document.documentElement.lang = language;

  return language;
}

function continueApp() {
  saveLanguage();

  sessionStorage.setItem("ryzonNextAction", "home");

  window.location.assign("./otp.html");
}

function randomChat() {
  saveLanguage();

  sessionStorage.setItem("ryzonNextAction", "randomChat");

  window.location.assign("./otp.html");
}

// Restore previously selected language.
(function restoreLanguage() {
  const selector = document.getElementById("language");
  let savedLanguage = localStorage.getItem(LANGUAGE_KEY);

  if (!savedLanguage) return;

  // Convert old saved language names into standard codes.
  if (oldLanguageValues[savedLanguage]) {
    savedLanguage = oldLanguageValues[savedLanguage];
    localStorage.setItem(LANGUAGE_KEY, savedLanguage);
  }

  const validLanguage = [...selector.options].some(
    option => option.value === savedLanguage
  );

  if (validLanguage) {
    selector.value = savedLanguage;
    document.documentElement.lang = savedLanguage;
  }
})();

// Update browser language when selection changes.
document.getElementById("language").addEventListener("change", function() {
  document.documentElement.lang = this.value;
});
</script>

<script>
/* RYZONE PWA AUTO UPDATE */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registration = await navigator.serviceWorker.register("./service-worker.js", {
        updateViaCache: "none"
      });

      let reloadAfterUpdate = false;
      let updateBanner;

      function showUpdateBanner() {
        if (updateBanner || !registration.waiting) return;

        const style = document.createElement("style");
        style.textContent = [
          "#ryzone-update-banner{position:fixed;left:12px;right:12px;bottom:16px;z-index:10000;max-width:560px;margin:auto;padding:15px;border:1px solid #d9aa43;border-radius:16px;background:#10100d;color:#fff8e8;box-shadow:0 8px 30px #000b;font-family:Arial,sans-serif}",
          "#ryzone-update-banner strong{display:block;color:#f5cf70;font-size:15px;margin-bottom:5px}",
          "#ryzone-update-banner p{margin:0 0 12px;color:#e8dfc9;font-size:13px;line-height:1.45}",
          "#ryzone-update-actions{display:flex;gap:9px}",
          "#ryzone-update-actions button{flex:1;min-height:42px;border:1px solid #d9aa43;border-radius:10px;font-weight:bold;font-size:13px}",
          "#ryzone-update-now{background:linear-gradient(135deg,#f5d77c,#c18b24);color:#17120a}",
          "#ryzone-update-later{background:#211d13;color:#f7e7bd}"
        ].join("");
        document.head.appendChild(style);

        updateBanner = document.createElement("section");
        updateBanner.id = "ryzone-update-banner";
        updateBanner.setAttribute("role", "status");
        const heading = document.createElement("strong");
        heading.textContent = "RYZONE update ready";
        const message = document.createElement("p");
        message.textContent = "A new version is downloaded. Update now to use the latest RYZONE features.";
        const actions = document.createElement("div");
        actions.id = "ryzone-update-actions";
        const updateButton = document.createElement("button");
        updateButton.id = "ryzone-update-now";
        updateButton.type = "button";
        updateButton.textContent = "Update now";
        updateButton.addEventListener("click", () => {
          if (!registration.waiting) return;
          reloadAfterUpdate = true;
          registration.waiting.postMessage({ type: "RYZONE_SKIP_WAITING" });
        });
        const laterButton = document.createElement("button");
        laterButton.id = "ryzone-update-later";
        laterButton.type = "button";
        laterButton.textContent = "Later";
        laterButton.addEventListener("click", () => {
          updateBanner.remove();
          updateBanner = null;
        });
        actions.append(updateButton, laterButton);
        updateBanner.append(heading, message, actions);
        document.body.appendChild(updateBanner);
      }

      if (registration.waiting) showUpdateBanner();

      registration.addEventListener("updatefound", () => {
        const installingWorker = registration.installing;
        if (!installingWorker) return;
        installingWorker.addEventListener("statechange", () => {
          if (installingWorker.state === "installed" && navigator.serviceWorker.controller) {
            showUpdateBanner();
          }
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloadAfterUpdate) window.location.reload();
      });

      await registration.update();

      // Check periodically while the app's language/start page remains open.
      window.setInterval(() => {
        registration.update().catch(error => {
          console.log("RYZONE update check failed:", error);
        });
      }, 60 * 60 * 1000);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          registration.update().catch(error => {
            console.log("RYZONE update check failed:", error);
          });
          if (registration.waiting) showUpdateBanner();
        }
      });
    } catch (error) {
      console.log("Service worker registration failed:", error);
    }
  });
}
</script>

</body>
</html>
